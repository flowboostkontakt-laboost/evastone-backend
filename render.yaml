# Render Blueprint — EvaStone backend (Laravel 12 + Filament), plan DARMOWY.
# Kompromisy free: web usypia po ~15 min bezczynności, Postgres free wygasa
# po ~30 dniach, brak osobnego workera (kolejka działa inline: QUEUE=sync).
# Media na dysku instancji (ulotne na free) — docelowo R2/S3 (dodamy AWS_*).
#
# Deploy: panel Render → New → Blueprint → wskaż repo → Retry. Sekrety (sync:false)
# uzupełniasz przy pierwszym deployu.

databases:
  - name: evastone-db
    databaseName: evastone
    user: evastone
    plan: free

services:
  # aplikacja webowa (strona + panel Filament /admin). Bez workera na free.
  - type: web
    name: evastone-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /up          # wbudowany health Laravela — nie dotyka bazy
    envVars:
      - fromGroup: evastone-shared
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: evastone-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: evastone-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: evastone-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: evastone-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: evastone-db, property: password }

# współdzielone (stałe + sekrety + generowane)
envVarGroups:
  - name: evastone-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr             # wyjątki widoczne w logach Render
      - key: APP_KEY
        sync: false                    # base64:... (dam Ci gotowy)
      - key: APP_URL
        sync: false                    # URL serwisu web po 1. deployu
      - key: APP_LOCALE
        value: de
      - key: APP_FALLBACK_LOCALE
        value: de

      # bez Redisa/workera na free — kolejka inline, cache i sesja w bazie
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database

      # media: Cloudflare R2 (trwałe, publicznie serwowane przez URL r2.dev)
      - key: FILESYSTEM_DISK
        value: s3
      - key: MEDIA_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        value: evastone-media
      - key: AWS_ENDPOINT
        value: https://1884db42a6996f62b06a716a38e6d979.r2.cloudflarestorage.com
      - key: AWS_URL
        value: https://pub-22c1ac5bb5af493f9d575fbda9a4e27f.r2.dev   # publiczny URL R2 (serwuje zdjęcia)
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # import katalogu ze zdalnej bazy ComUp (read-only)
      - key: COMUP_LEGACY_HOST
        value: kacper.comup.pl
      - key: COMUP_LEGACY_PORT
        value: "3306"
      - key: COMUP_LEGACY_DATABASE
        sync: false
      - key: COMUP_LEGACY_USERNAME
        sync: false
      - key: COMUP_LEGACY_PASSWORD
        sync: false
      - key: COMUP_UPLOAD_BASE
        value: https://evastone.comup.pl

      # RODO / newsletter
      - key: IP_PEPPER
        generateValue: true
      - key: NEWSLETTER_CONSENT_VERSION
        value: nl-2026-08-1

      # mail: log do czasu konfiguracji SMTP (CTO, dok. 07 §6)
      - key: MAIL_MAILER
        value: log
