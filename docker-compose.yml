services:
  app:
    image: evastone-app:dev
    build: .
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/root/.composer/cache
      - ../eva:/mirror:ro
    ports:
      - "8080:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis

  queue:
    image: evastone-app:dev
    build: .
    working_dir: /var/www/html
    command: php artisan queue:work --queue=imports,media,mail,default --tries=3 --timeout=900
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ../eva:/mirror:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_CLIENT: predis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: evastone
      MYSQL_USER: evastone
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"

volumes:
  mysql-data:
  vendor:
  composer-cache:
